<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="matchaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="50%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="shadowCha" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#10B981" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g transform="translate(40, 20)">
    <ellipse cx="160" cy="330" rx="120" ry="22" fill="#A7F3D0" opacity="0.6"/>

    <!-- 雲朵身體 -->
    <path d="M 85,245 
             C 35,245 25,175 68,150 
             C 45,95 105,60 142,95 
             C 175,45 245,55 262,105 
             C 310,115 315,190 280,230 
             C 298,272 248,302 210,285 
             C 170,310 102,298 85,245 Z" 
          fill="url(#matchaGrad)" stroke="#86EFAC" stroke-width="7" stroke-linejoin="round" filter="url(#shadowCha)"/>

    <!-- 頭頂小茶葉嫩芽 -->
    <g transform="translate(160, 48) scale(2.6)">
      <path d="M 0,12 Q -9,2 -14,5 Q -7,14 0,12" fill="#15803D"/>
      <path d="M 0,12 Q 9,2 14,5 Q 7,14 0,12" fill="#22C55E"/>
      <line x1="0" y1="12" x2="0" y2="17" stroke="#14532D" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- 嫩綠腮紅 -->
    <ellipse cx="95" cy="220" rx="22" ry="13" fill="#86EFAC" opacity="0.9"/>
    <ellipse cx="230" cy="220" rx="22" ry="13" fill="#86EFAC" opacity="0.9"/>

    <!-- 瞇瞇眼治癒好眠表情 (◠‿◠) -->
    <path d="M 110,195 Q 126,174 142,195" stroke="#14532D" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 184,195 Q 200,174 216,195" stroke="#14532D" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- 呆萌小圓嘴 :o -->
    <circle cx="163" cy="216" r="8" fill="#14532D"/>

    <!-- 飄出的瞌睡泡泡 -->
    <circle cx="240" cy="160" r="9" fill="#6EE7B7" opacity="0.7"/>
    <circle cx="260" cy="135" r="14" fill="#6EE7B7" opacity="0.6"/>
  </g>
</svg>
