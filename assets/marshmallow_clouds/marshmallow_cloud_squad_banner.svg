<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="45%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <filter id="bannerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#F472B6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 天空背景 -->
  <rect width="1200" height="500" rx="24" fill="url(#skyGrad)"/>

  <!-- 背景漂浮小雲朵與星光 -->
  <path d="M 120,80 C 100,80 90,65 105,55 C 95,45 110,35 125,45 C 135,35 155,38 160,50 C 175,52 175,70 165,80 Z" fill="#FFFFFF" opacity="0.6"/>
  <path d="M 980,120 C 960,120 950,105 965,95 C 955,85 970,75 985,85 C 995,75 1015,78 1020,90 C 1035,92 1035,110 1025,120 Z" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="280" cy="90" r="4" fill="#FBBF24" opacity="0.7"/>
  <circle cx="850" cy="70" r="5" fill="#F472B6" opacity="0.7"/>
  <circle cx="600" cy="60" r="6" fill="#38BDF8" opacity="0.7"/>

  <!-- 標題橫幅文字 -->
  <g transform="translate(600, 95)" text-anchor="middle">
    <rect x="-240" y="-36" width="480" height="60" rx="30" fill="#FFFFFF" opacity="0.85" filter="url(#bannerShadow)"/>
    <text x="0" y="8" font-family="'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="900" fill="#DB2777" letter-spacing="2">
      ☁️ 蓬鬆雲朵棉花糖天團 🍡
    </text>
  </g>

  <!-- 角色群像排列 (自左至右) -->
  
  <!-- 1. 焦焦 (微焦烤雲) -->
  <g transform="translate(80, 160) scale(0.68)" filter="url(#bannerShadow)">
    <ellipse cx="160" cy="330" rx="120" ry="22" fill="#FDE68A" opacity="0.5"/>
    <path d="M 85,245 C 35,245 25,175 68,150 C 45,95 105,60 142,95 C 175,45 245,55 262,105 C 310,115 315,190 280,230 C 298,272 248,302 210,285 C 170,310 102,298 85,245 Z" fill="#D97706" stroke="#FCD34D" stroke-width="7"/>
    <path d="M 68,125 Q 160,35 256,125" stroke="#B45309" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="155" r="28" fill="#F59E0B" stroke="#B45309" stroke-width="6"/>
    <circle cx="274" cy="155" r="28" fill="#F59E0B" stroke="#B45309" stroke-width="6"/>
    <ellipse cx="95" cy="220" rx="22" ry="13" fill="#F59E0B" opacity="0.6"/>
    <ellipse cx="230" cy="220" rx="22" ry="13" fill="#F59E0B" opacity="0.6"/>
    <path d="M 112,195 Q 126,178 140,195" stroke="#451A03" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="200" cy="195" r="13" fill="#451A03"/>
    <circle cx="205" cy="190" r="5" fill="#FFFFFF"/>
    <path d="M 150,218 Q 170,232 184,210" stroke="#451A03" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 2. 彩彩 (極光彩霞雲) -->
  <g transform="translate(300, 150) scale(0.72)" filter="url(#bannerShadow)">
    <ellipse cx="160" cy="330" rx="120" ry="22" fill="#E9D5FF" opacity="0.6"/>
    <path d="M 85,245 C 35,245 25,175 68,150 C 45,95 105,60 142,95 C 175,45 245,55 262,105 C 310,115 315,190 280,230 C 298,272 248,302 210,285 C 170,310 102,298 85,245 Z" fill="#FBCFE8" stroke="#F5D0FE" stroke-width="7"/>
    <circle cx="125" cy="195" r="14" fill="#4A044E"/>
    <circle cx="130" cy="190" r="5.5" fill="#FFFFFF"/>
    <circle cx="200" cy="195" r="14" fill="#4A044E"/>
    <circle cx="205" cy="190" r="5.5" fill="#FFFFFF"/>
    <ellipse cx="95" cy="220" rx="22" ry="13" fill="#F472B6" opacity="0.8"/>
    <ellipse cx="230" cy="220" rx="22" ry="13" fill="#F472B6" opacity="0.8"/>
    <path d="M 148,212 Q 155,221 162,212 Q 169,221 176,212" stroke="#4A044E" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 3. 波波 (中心 C 位主角：草莓鮮奶雲) -->
  <g transform="translate(520, 130) scale(0.85)" filter="url(#bannerShadow)">
    <ellipse cx="160" cy="330" rx="120" ry="22" fill="#FED7E2" opacity="0.6"/>
    <path d="M 85,245 C 35,245 25,175 68,150 C 45,95 105,60 142,95 C 175,45 245,55 262,105 C 310,115 315,190 280,230 C 298,272 248,302 210,285 C 170,310 102,298 85,245 Z" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="7"/>
    <!-- 草莓帽 -->
    <g transform="translate(175, 30) rotate(15) scale(2.8)">
      <path d="M 12,2 C 24,2 26,19 12,28 C -2,19 0,2 12,2 Z" fill="#FF4D6D"/>
      <circle cx="8" cy="11" r="1.1" fill="#FFE066"/>
      <circle cx="15" cy="13" r="1.1" fill="#FFE066"/>
      <path d="M 12,2 Q 6,-5 3,-2 Q 9,2 12,2 Q 15,-5 21,-2 Q 15,2 12,2" fill="#4ADE80"/>
    </g>
    <ellipse cx="95" cy="220" rx="22" ry="13" fill="#F472B6" opacity="0.75"/>
    <ellipse cx="230" cy="220" rx="22" ry="13" fill="#F472B6" opacity="0.75"/>
    <circle cx="125" cy="195" r="13" fill="#2D1521"/>
    <circle cx="130" cy="190" r="5" fill="#FFFFFF"/>
    <circle cx="200" cy="195" r="13" fill="#2D1521"/>
    <circle cx="205" cy="190" r="5" fill="#FFFFFF"/>
    <path d="M 148,212 Q 162,230 178,212" stroke="#2D1521" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 4. 茶茶 (抹茶奶霜雲) -->
  <g transform="translate(770, 150) scale(0.72)" filter="url(#bannerShadow)">
    <ellipse cx="160" cy="330" rx="120" ry="22" fill="#A7F3D0" opacity="0.6"/>
    <path d="M 85,245 C 35,245 25,175 68,150 C 45,95 105,60 142,95 C 175,45 245,55 262,105 C 310,115 315,190 280,230 C 298,272 248,302 210,285 C 170,310 102,298 85,245 Z" fill="#D1FAE5" stroke="#86EFAC" stroke-width="7"/>
    <!-- 嫩芽 -->
    <g transform="translate(160, 48) scale(2.6)">
      <path d="M 0,12 Q -9,2 -14,5 Q -7,14 0,12" fill="#15803D"/>
      <path d="M 0,12 Q 9,2 14,5 Q 7,14 0,12" fill="#22C55E"/>
    </g>
    <ellipse cx="95" cy="220" rx="22" ry="13" fill="#86EFAC" opacity="0.9"/>
    <ellipse cx="230" cy="220" rx="22" ry="13" fill="#86EFAC" opacity="0.9"/>
    <path d="M 110,195 Q 126,174 142,195" stroke="#14532D" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 184,195 Q 200,174 216,195" stroke="#14532D" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="163" cy="216" r="8" fill="#14532D"/>
  </g>

  <!-- 5. 米米 (糖霜迷你小飛雲，前置歡呼) -->
  <g transform="translate(970, 180) scale(0.6)" filter="url(#bannerShadow)">
    <ellipse cx="140" cy="300" rx="95" ry="18" fill="#FDE047" opacity="0.45"/>
    <path d="M 80,215 C 32,215 25,145 68,125 C 50,85 100,55 135,78 C 165,40 220,46 238,85 C 278,98 280,160 250,195 C 264,232 222,256 188,242 C 152,260 98,252 80,215 Z" fill="#FFFDF5" stroke="#FDE047" stroke-width="7"/>
    <circle cx="112" cy="170" r="13" fill="#0F172A"/>
    <circle cx="182" cy="170" r="13" fill="#0F172A"/>
    <ellipse cx="88" cy="195" rx="18" ry="11" fill="#FDA4AF" opacity="0.9"/>
    <ellipse cx="205" cy="195" rx="18" ry="11" fill="#FDA4AF" opacity="0.9"/>
    <path d="M 135,190 Q 148,206 160,190" stroke="#0F172A" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
