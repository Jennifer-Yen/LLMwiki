<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chaoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="28%" stop-color="#D97706"/>
      <stop offset="55%" stop-color="#FDE68A"/>
      <stop offset="90%" stop-color="#FFFBEB"/>
    </linearGradient>
    <filter id="shadowChao" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#B45309" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g transform="translate(40, 20)">
    <!-- 陰影 -->
    <ellipse cx="160" cy="330" rx="120" ry="22" fill="#FDE68A" opacity="0.5"/>

    <!-- 雲朵身體 -->
    <path d="M 85,245 
             C 35,245 25,175 68,150 
             C 45,95 105,60 142,95 
             C 175,45 245,55 262,105 
             C 310,115 315,190 280,230 
             C 298,272 248,302 210,285 
             C 170,310 102,298 85,245 Z" 
          fill="url(#chaoGrad)" stroke="#FCD34D" stroke-width="7" stroke-linejoin="round" filter="url(#shadowChao)"/>

    <!-- 溫暖耳罩結構 -->
    <path d="M 68,125 Q 160,35 256,125" stroke="#B45309" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- 兩側大耳球 -->
    <g transform="translate(50, 155)">
      <circle cx="0" cy="0" r="28" fill="#F59E0B" stroke="#B45309" stroke-width="6"/>
      <circle cx="0" cy="0" r="16" fill="#FEF3C7"/>
    </g>
    <g transform="translate(274, 155)">
      <circle cx="0" cy="0" r="28" fill="#F59E0B" stroke="#B45309" stroke-width="6"/>
      <circle cx="0" cy="0" r="16" fill="#FEF3C7"/>
    </g>

    <!-- 暖陽腮紅 -->
    <ellipse cx="95" cy="220" rx="22" ry="13" fill="#F59E0B" opacity="0.6"/>
    <ellipse cx="230" cy="220" rx="22" ry="13" fill="#F59E0B" opacity="0.6"/>

    <!-- 酷甜表情：左眼眨眼，右眼大萌眼 -->
    <path d="M 112,195 Q 126,178 140,195" stroke="#451A03" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="200" cy="195" r="13" fill="#451A03"/>
    <circle cx="205" cy="190" r="5" fill="#FFFFFF"/>
    <circle cx="195" cy="200" r="2.5" fill="#FFFFFF"/>

    <!-- 自信歪嘴笑 -->
    <path d="M 150,218 Q 170,232 184,210" stroke="#451A03" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
</svg>
