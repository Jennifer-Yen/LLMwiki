<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="shadowMi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#FBBF24" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(60, 40)">
    <ellipse cx="140" cy="300" rx="95" ry="18" fill="#FDE047" opacity="0.45"/>

    <!-- 迷你雲朵身軀 -->
    <path d="M 80,215 
             C 32,215 25,145 68,125 
             C 50,85 100,55 135,78 
             C 165,40 220,46 238,85 
             C 278,98 280,160 250,195 
             C 264,232 222,256 188,242 
             C 152,260 98,252 80,215 Z" 
          fill="#FFFDF5" stroke="#FDE047" stroke-width="7" stroke-linejoin="round" filter="url(#shadowMi)"/>

    <!-- 彩虹糖霜米飾品 -->
    <rect x="105" y="72" width="22" height="9" rx="4.5" fill="#F43F5E" transform="rotate(-25 116 76)"/>
    <rect x="175" y="65" width="22" height="9" rx="4.5" fill="#38BDF8" transform="rotate(35 186 69)"/>
    <rect x="142" y="90" width="22" height="9" rx="4.5" fill="#FBBF24" transform="rotate(10 153 94)"/>

    <!-- 雙頰腮紅 -->
    <ellipse cx="88" cy="195" rx="18" ry="11" fill="#FDA4AF" opacity="0.9"/>
    <ellipse cx="205" cy="195" rx="18" ry="11" fill="#FDA4AF" opacity="0.9"/>

    <!-- 活力星星萌眼 -->
    <circle cx="112" cy="170" r="13" fill="#0F172A"/>
    <circle cx="117" cy="164" r="5" fill="#FFFFFF"/>
    <circle cx="182" cy="170" r="13" fill="#0F172A"/>
    <circle cx="187" cy="164" r="5" fill="#FFFFFF"/>

    <!-- 開心歡呼嘴 -->
    <path d="M 135,190 Q 148,206 160,190" stroke="#0F172A" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
