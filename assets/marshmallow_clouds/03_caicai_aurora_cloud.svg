<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBCFE8"/>
      <stop offset="35%" stop-color="#E9D5FF"/>
      <stop offset="70%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <filter id="shadowCai" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#C084FC" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(40, 20)">
    <!-- 陰影 -->
    <ellipse cx="160" cy="330" rx="120" ry="22" fill="#E9D5FF" opacity="0.6"/>

    <!-- 彩霞雲朵身軀 -->
    <path d="M 85,245 
             C 35,245 25,175 68,150 
             C 45,95 105,60 142,95 
             C 175,45 245,55 262,105 
             C 310,115 315,190 280,230 
             C 298,272 248,302 210,285 
             C 170,310 102,298 85,245 Z" 
          fill="url(#auroraGrad)" stroke="#F5D0FE" stroke-width="7" stroke-linejoin="round" filter="url(#shadowCai)"/>

    <!-- 彩虹髮卡與星星頭飾 -->
    <g transform="translate(200, 60) rotate(-10) scale(2.2)">
      <path d="M 0,16 A 16,16 0 0,1 32,16" stroke="#F472B6" stroke-width="4.5" fill="none"/>
      <path d="M 4,16 A 12,12 0 0,1 28,16" stroke="#FBBF24" stroke-width="4.5" fill="none"/>
      <path d="M 8,16 A 8,8 0 0,1 24,16" stroke="#60A5FA" stroke-width="4.5" fill="none"/>
      <polygon points="16,-3 19,5 27,5 21,10 23,18 16,13 9,18 11,10 5,5 13,5" fill="#FBBF24"/>
    </g>

    <!-- 少女粉腮紅 -->
    <ellipse cx="95" cy="220" rx="22" ry="13" fill="#F472B6" opacity="0.8"/>
    <ellipse cx="230" cy="220" rx="22" ry="13" fill="#F472B6" opacity="0.8"/>

    <!-- 雙眼自帶星芒 -->
    <circle cx="125" cy="195" r="14" fill="#4A044E"/>
    <circle cx="130" cy="190" r="5.5" fill="#FFFFFF"/>
    <circle cx="120" cy="201" r="3" fill="#FFFFFF"/>
    <circle cx="200" cy="195" r="14" fill="#4A044E"/>
    <circle cx="205" cy="190" r="5.5" fill="#FFFFFF"/>
    <circle cx="195" cy="201" r="3" fill="#FFFFFF"/>

    <!-- 貓咪軟萌嘴 -->
    <path d="M 148,212 Q 155,221 162,212 Q 169,221 176,212" stroke="#4A044E" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
