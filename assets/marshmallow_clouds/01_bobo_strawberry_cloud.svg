<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="boboGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFF5F7"/>
      <stop offset="100%" stop-color="#FED7E2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#F472B6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(40, 20)">
    <!-- 陰影底盤 -->
    <ellipse cx="160" cy="330" rx="120" ry="22" fill="#FED7E2" opacity="0.6"/>

    <!-- 雲朵身體 (400x400 scale) -->
    <path d="M 85,245 
             C 35,245 25,175 68,150 
             C 45,95 105,60 142,95 
             C 175,45 245,55 262,105 
             C 310,115 315,190 280,230 
             C 298,272 248,302 210,285 
             C 170,310 102,298 85,245 Z" 
          fill="url(#boboGrad)" stroke="#FCE7F3" stroke-width="7" stroke-linejoin="round" filter="url(#shadow)"/>

    <!-- 內部高光反光 (膨脹立體感) -->
    <path d="M 90,145 C 115,105 155,110 168,138" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 190,105 C 220,95 250,110 258,145" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 58,190 C 50,165 78,150 95,162" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- 草莓小貝雷帽 -->
    <g transform="translate(175, 30) rotate(15) scale(2.8)">
      <path d="M 12,2 C 24,2 26,19 12,28 C -2,19 0,2 12,2 Z" fill="#FF4D6D"/>
      <circle cx="8" cy="11" r="1.1" fill="#FFE066"/>
      <circle cx="15" cy="13" r="1.1" fill="#FFE066"/>
      <circle cx="11" cy="19" r="1.1" fill="#FFE066"/>
      <circle cx="14" cy="23" r="1.1" fill="#FFE066"/>
      <path d="M 12,2 Q 6,-5 3,-2 Q 9,2 12,2 Q 15,-5 21,-2 Q 15,2 12,2" fill="#4ADE80"/>
      <circle cx="12" cy="1" r="1.5" fill="#22C55E"/>
    </g>

    <!-- 軟萌大腮紅 -->
    <ellipse cx="95" cy="220" rx="22" ry="13" fill="#F472B6" opacity="0.75"/>
    <ellipse cx="230" cy="220" rx="22" ry="13" fill="#F472B6" opacity="0.75"/>

    <!-- 亮晶晶大眼 (自帶高光與星瞳) -->
    <circle cx="125" cy="195" r="13" fill="#2D1521"/>
    <circle cx="130" cy="190" r="5" fill="#FFFFFF"/>
    <circle cx="120" cy="200" r="2.5" fill="#FFFFFF"/>
    <circle cx="200" cy="195" r="13" fill="#2D1521"/>
    <circle cx="205" cy="190" r="5" fill="#FFFFFF"/>
    <circle cx="195" cy="200" r="2.5" fill="#FFFFFF"/>

    <!-- 開心笑嘴 -->
    <path d="M 148,212 Q 162,230 178,212" stroke="#2D1521" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- 蓬蓬小手手 -->
    <circle cx="50" cy="225" r="14" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="5"/>
    <circle cx="275" cy="225" r="14" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="5"/>
  </g>
</svg>
