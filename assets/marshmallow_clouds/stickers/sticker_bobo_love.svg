<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#F43F5E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 貼圖粗白邊 (Sticker Die-cut Outline) -->
  <g filter="url(#stickerShadow)">
    <!-- 白色底托 -->
    <path d="M 110,280 C 40,280 30,180 85,150 C 55,80 130,40 180,85 C 220,25 310,40 330,100 C 390,115 395,210 350,260 C 370,310 310,350 260,330 C 210,360 130,345 110,280 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
    
    <!-- 波波雲朵主體 -->
    <path d="M 110,280 C 50,280 40,190 90,160 C 65,95 135,60 180,100 C 215,45 295,60 315,115 C 370,130 375,215 335,260 C 355,305 300,340 255,320 C 210,350 135,335 110,280 Z" 
          fill="#FFF5F7" stroke="#FCE7F3" stroke-width="6"/>
  </g>

  <!-- 草莓帽 -->
  <g transform="translate(230, 40) rotate(15) scale(2.6)">
    <path d="M 12,2 C 24,2 26,19 12,28 C -2,19 0,2 12,2 Z" fill="#FF4D6D"/>
    <circle cx="8" cy="11" r="1.1" fill="#FFE066"/>
    <circle cx="15" cy="13" r="1.1" fill="#FFE066"/>
    <path d="M 12,2 Q 6,-5 3,-2 Q 9,2 12,2 Q 15,-5 21,-2 Q 15,2 12,2" fill="#4ADE80"/>
  </g>

  <!-- 大愛心在胸前 (波波抱著大草莓愛心) -->
  <path d="M 200,240 C 200,210 160,195 160,225 C 160,250 200,280 200,290 C 200,280 240,250 240,225 C 240,195 200,210 200,240 Z" 
        fill="#FF4D6D" stroke="#FFE4E6" stroke-width="5" transform="translate(-10, -20) scale(1.1)"/>

  <!-- 開心瞇瞇眼與腮紅 -->
  <path d="M 140,185 Q 155,168 170,185" stroke="#2D1521" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 230,185 Q 245,168 260,185" stroke="#2D1521" stroke-width="7" stroke-linecap="round" fill="none"/>
  <ellipse cx="125" cy="200" rx="18" ry="11" fill="#F472B6" opacity="0.8"/>
  <ellipse cx="275" cy="200" rx="18" ry="11" fill="#F472B6" opacity="0.8"/>

  <!-- 浮動小愛心 -->
  <g transform="translate(60, 90) scale(0.8)">
    <path d="M 20,20 C 20,10 0,5 0,20 C 0,35 20,50 20,55 C 20,50 40,35 40,20 C 40,5 20,10 20,20 Z" fill="#FB7185"/>
  </g>
  <g transform="translate(320, 80) scale(0.65) rotate(15)">
    <path d="M 20,20 C 20,10 0,5 0,20 C 0,35 20,50 20,55 C 20,50 40,35 40,20 C 40,5 20,10 20,20 Z" fill="#FB7185"/>
  </g>

  <!-- 貼圖文字標籤 -->
  <g transform="translate(200, 365)">
    <rect x="-70" y="-22" width="140" height="34" rx="17" fill="#FF4D6D" stroke="#FFFFFF" stroke-width="4"/>
    <text x="0" y="2" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">LOVE YOU!</text>
  </g>
</svg>
