<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="stickerShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#stickerShadow2)">
    <!-- 白色底托 -->
    <path d="M 110,280 C 40,280 30,180 85,150 C 55,80 130,40 180,85 C 220,25 310,40 330,100 C 390,115 395,210 350,260 C 370,310 310,350 260,330 C 210,360 130,345 110,280 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
    <!-- 茶茶主體 -->
    <path d="M 110,280 C 50,280 40,190 90,160 C 65,95 135,60 180,100 C 215,45 295,60 315,115 C 370,130 375,215 335,260 C 355,305 300,340 255,320 C 210,350 135,335 110,280 Z" 
          fill="#ECFDF5" stroke="#A7F3D0" stroke-width="6"/>
  </g>

  <!-- 睡帽 (Nightcap) -->
  <g transform="translate(190, 50) rotate(-20) scale(1.3)">
    <path d="M 0,40 C 20,10 60,0 80,40 Z" fill="#6EE7B7"/>
    <path d="M 60,10 Q 90,-10 110,15" stroke="#6EE7B7" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="112" cy="18" r="10" fill="#FEF08A"/>
    <rect x="-5" y="36" width="90" height="12" rx="6" fill="#FFFFFF"/>
  </g>

  <!-- 睡眼 (◠‿◠) -->
  <path d="M 135,195 Q 150,175 165,195" stroke="#14532D" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 235,195 Q 250,175 265,195" stroke="#14532D" stroke-width="7" stroke-linecap="round" fill="none"/>
  <ellipse cx="120" cy="210" rx="18" ry="11" fill="#86EFAC" opacity="0.9"/>
  <ellipse cx="280" cy="210" rx="18" ry="11" fill="#86EFAC" opacity="0.9"/>

  <!-- 呼嚕嚕泡泡與 Zzz -->
  <circle cx="215" cy="210" r="7" fill="#14532D"/>
  <circle cx="265" cy="165" r="10" fill="#A7F3D0" opacity="0.8"/>
  <circle cx="295" cy="135" r="15" fill="#A7F3D0" opacity="0.7"/>

  <text x="325" y="110" font-family="sans-serif" font-size="28" font-weight="bold" fill="#059669">Z</text>
  <text x="345" y="85" font-family="sans-serif" font-size="22" font-weight="bold" fill="#10B981">z</text>
  <text x="360" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#34D399">z</text>

  <!-- 標籤 -->
  <g transform="translate(200, 365)">
    <rect x="-80" y="-22" width="160" height="34" rx="17" fill="#059669" stroke="#FFFFFF" stroke-width="4"/>
    <text x="0" y="2" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">GOOD NIGHT~</text>
  </g>
</svg>
